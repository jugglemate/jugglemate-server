port: 8050

log:
  logPath: ./logs
  logName: jugglemate-server

# IM HTTP API 根地址：Bot 注册、建群、群成员变更共用。
# 注意：Bot 的 token 由这里签发，必须与下面 agent.im.wsAddress 属于同一套 IM，否则连接会被拒。
imApiDomain: http://127.0.0.1:9001
jmateBaseUrl: http://127.0.0.1:8050

# Go 版 Agent 平台。完整部署必须启用并配置 PostgreSQL、Redis 与模型 Provider。
agent:
  enabled: true
  postgres:
    dsn: host=127.0.0.1 user=postgres password=postgres dbname=jmate_db port=5432 sslmode=disable TimeZone=Asia/Shanghai
    debug: false
    maxIdleConns: 10
    maxOpenConns: 50
    connMaxLifetimeSeconds: 3600
  redis:
    address: 127.0.0.1:6379
    username: ""
    password: ""
    db: 0
    dialTimeoutSeconds: 5
  auth:
    enabled: true
    # 上游 JMate 校验身份后转发时携带的共享密钥；Agent 原生入口只信任它。
    internalSecret: change-me-shared-internal-secret
  security:
    secretKey: "jmate-agent-secret-key"
    secretSalt: "jmate-agent-secret-salt"
  knowledge:
    workerEnabled: false
    vectorDimension: 1536
    vectorBatchSize: 32
    maxFileSizeMB: 10
    vectorizeStream: knowledge_vectorize_stream
    consumerGroup: knowledge_vectorize_group
    consumerName: knowledge_vectorize_worker_1
    taskTimeoutSeconds: 600
    maxRetries: 3
    objectStorageRoot: ./data/agent/knowledge
  tools:
    # 系统内置支付查询工具的服务地址；生产环境必须显式覆盖。
    innerAPIBaseURL: https://t.JG.pro
  billing:
    directFreeDailyEnabled: true
    directFreeDailyTokens: 500000
    directQuotaTimezone: Asia/Shanghai
  profile:
    # 首个 Agent 创建成功后赠送的 Credit；赠送失败不回滚 Agent。
    firstAgentRechargeAmount: "10000"
    activationPointsCheckEnabled: true
  im:
    enabled: true
    # Bot 常驻连接的 WebSocket 地址，必须与顶层 imApiDomain 属于同一套 IM。
    wsAddress: wss://127.0.0.1
    # 仅可信测试环境允许跳过 Server API TLS 校验。
    serverAPIInsecure: false
